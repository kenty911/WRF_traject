name: Test netCDF4 and Dependencies

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering from GitHub UI

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gfortran libnetcdf-dev libhdf5-dev gcc g++
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
    
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        uv sync --extra dev
    
    - name: Install wrf-python (Python <3.12 only)
      if: ${{ !startsWith(matrix.python-version, '3.12') && !startsWith(matrix.python-version, '3.13') }}
      run: |
        # wrf-python requires numpy.distutils (removed in numpy 2.0) for building
        # First ensure we have numpy<2.0 with distutils, Cython, and setuptools
        uv pip install "numpy<2.0" "Cython" "setuptools"
        # Install wrf-python without build isolation to use installed numpy
        uv pip install --no-build-isolation wrf-python
      continue-on-error: false
    
    - name: Run pytest
      run: |
        uv run pytest test_netcdf4.py -v --tb=short
    
    - name: Test summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "Python version: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
        echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
