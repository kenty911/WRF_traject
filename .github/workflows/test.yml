name: Test netCDF4 and Dependencies

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering from GitHub UI

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gfortran libnetcdf-dev libhdf5-dev gcc g++ libnetcdff-dev pkg-config
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
    
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        uv sync --extra dev
    
    - name: Install wrf-python (Python <3.12 only)
      if: ${{ !startsWith(matrix.python-version, '3.12') && !startsWith(matrix.python-version, '3.13') }}
      run: |
        # wrf-python requires numpy.distutils (removed in numpy 2.0) for building
        # Install in two steps to ensure numpy is available before Cython
        # Step 1: Core build tools and numpy (Cython needs numpy at install time)
        uv pip install "numpy<2.0" "setuptools<70" "wheel"
        # Step 2: Cython and other dependencies
        uv pip install "Cython<3.0" "wrapt"
        
        # Set environment variables for netCDF library paths
        export NETCDF=$(nc-config --prefix)
        export HDF5=$(nc-config --prefix)
        export HDF5_DIR=/usr
        export NETCDF4_DIR=$(nc-config --prefix)
        export USE_NCCONFIG=1
        
        # Show configuration for debugging
        echo "=== Build Environment ==="
        echo "NETCDF: $NETCDF"
        echo "Python: $(uv run python --version)"
        echo "numpy: $(uv run python -c 'import numpy; print(numpy.__version__)')"
        nc-config --all
        
        # Install wrf-python using the environment's packages
        echo "=== Installing wrf-python ==="
        uv pip install --no-build-isolation wrf-python
    
    - name: Run pytest
      run: |
        uv run pytest test_netcdf4.py -v --tb=short
    
    - name: Test summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "Python version: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
        echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
